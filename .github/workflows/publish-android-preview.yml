name: Publish Android 1.4.2 preview
on:
  push:
    branches: [codex/publish-1.4.2-preview]
    paths: [.release-tools/preview-1.4.2/manifest.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-android-1.4.2-preview
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ghshshshhsua/eidolon-sc-releases' && github.ref == 'refs/heads/codex/publish-1.4.2-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch this exact publication commit
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/ghshshshhsua/eidolon-sc-releases.git
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify assets and publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-tools/preview-1.4.2/publish.py

